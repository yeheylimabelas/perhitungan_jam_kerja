<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perhitungan Jam Kerja</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-EVSTQN3/azprG1Anm3QDgpJLIm9Nao0Yz1ztcQTwFspd3yD65VohhpuuCOmLASjC"
      crossorigin="anonymous"
    />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css"
    />
    <link rel="stylesheet" href="style.css" />
    <link
      rel="icon"
      href="Dollar_sign_icon-removebg-preview.png"
      type="image/x-icon"
    />
  </head>
  <body>
    <div class="container">
      <h1 class="mb-4">Perhitungan Jam Kerja</h1>
      <form id="dateForm" class="mb-4">
        <div class="mb-3">
          <label for="startDate" class="form-label"
            >Masukkan tanggal mulai:</label
          >
          <div class="input-group">
            <input
              type="text"
              id="startDate"
              class="form-control"
              readonly
              required
            />
            <span class="input-group-text cursor-pointer" id="startDateIcon"
              >📅</span
            >
          </div>
        </div>

        <div class="mb-3">
          <label for="endDate" class="form-label"
            >Masukkan tanggal akhir:</label
          >
          <div class="input-group">
            <input
              type="text"
              id="endDate"
              class="form-control"
              readonly
              required
            />
            <span class="input-group-text cursor-pointer" id="endDateIcon"
              >📅</span
            >
          </div>
        </div>
        <div class="mb-3 position-relative">
          <label for="holidayPicker" class="form-label"
            >Pilih Hari Libur (bisa lebih dari 1):</label
          >
          <div class="input-group">
            <input
              type="text"
              id="holidayPicker"
              class="form-control"
              placeholder="Pilih tanggal libur..."
              readonly
            />
            <span class="input-group-text cursor-pointer" id="calendarIcon">
              📅
            </span>
          </div>
        </div>
        <div id="holidayTagsContainer" class="d-flex flex-wrap mt-3"></div>
      </form>
      <div id="result">
        <h2>Hasil Perhitungan</h2>
        <table class="table table-bordered">
          <tbody id="resultTable"></tbody>
        </table>
      </div>
    </div>

    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-pb5iUHT2OTpTrT3jbvNhF3bvn4UUSdbQqil7qqsk5gybVWwYqF1Jz4chQ8SBuGHX"
      crossorigin="anonymous"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="script.js"></script>
  </body>
</html>
