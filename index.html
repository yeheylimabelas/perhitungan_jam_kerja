<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perhitungan Jam Kerja DAD</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
      };
    </script>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link
      rel="icon"
      href="Clock_icon-removebg-preview.png"
      type="image/x-icon"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <div id="globalAlert" class="global-alert hidden" role="alert">
    <div class="global-alert-content">
      <span class="alert-text">
        <strong>Tanggal dikunci.</strong>
        Aktifkan <b>Tanggal Kustom</b> untuk mengubah tanggal mulai dan akhir.
      </span>
      <button id="closeAlert" class="alert-close">×</button>
    </div>
  </div>

  <body
    class="bg-white text-black dark:bg-gray-900 dark:text-white min-h-screen p-4"
  >
    <div class="max-w-3xl mx-auto">
      <h1 class="text-3xl font-bold mb-6">Perhitungan Jam Kerja DAD</h1>
      <!-- MODE PERHITUNGAN -->
      <div class="mb-6">
        <label class="block mb-2 font-semibold">Opsi Tanggal</label>

        <div class="flex gap-6 items-center flex-wrap">
          <label class="flex items-center gap-2 cursor-pointer">
            <input
              type="radio"
              name="calculationMode"
              value="until"
              checked
              class="accent-green-500"
            />
            <span>Sampai Hari Ini</span>
          </label>

          <label class="flex items-center gap-2 cursor-pointer">
            <input
              type="radio"
              name="calculationMode"
              value="monthly"
              class="accent-green-500"
            />
            <span>Bulan Ini</span>
          </label>

          <label class="flex items-center gap-2 cursor-pointer">
            <input
              type="radio"
              name="calculationMode"
              value="yearly"
              class="accent-green-500"
            />
            <span>Tahun Ini</span>
          </label>

          <label class="flex items-center gap-2 cursor-pointer">
            <input
              type="radio"
              name="calculationMode"
              value="custom"
              class="accent-green-500"
            />
            <span>Tanggal Kustom</span>
          </label>
        </div>

        <p
          id="modeHint"
          class="text-sm mt-2 text-gray-500 dark:text-gray-400"
        ></p>
      </div>

      <!-- FORM TANGGAL -->
      <form id="dateForm" class="space-y-6">
        <div>
          <label for="startDate" class="block mb-1 font-medium"
            >Masukkan Tanggal Mulai:</label
          >
          <div class="flex items-center gap-2">
            <input
              type="text"
              id="startDate"
              class="w-full rounded-md border border-gray-300 p-2 dark:bg-gray-800 dark:border-gray-700"
              readonly
              required
            />
            <span class="cursor-pointer text-xl" id="startDateIcon">📅</span>
          </div>
        </div>

        <div>
          <label for="endDate" class="block mb-1 font-medium"
            >Masukkan Tanggal Akhir:</label
          >
          <div class="flex items-center gap-2">
            <input
              type="text"
              id="endDate"
              class="w-full rounded-md border border-gray-300 p-2 dark:bg-gray-800 dark:border-gray-700"
              readonly
              required
            />
            <span class="cursor-pointer text-xl" id="endDateIcon">📅</span>
          </div>
        </div>

        <div>
          <label for="holidayPicker" class="block mb-1 font-medium"
            >Pilih Hari Libur/Sakit/Cuti (bisa lebih dari 1):</label
          >
          <div class="flex items-center gap-2">
            <input
              type="text"
              id="holidayPicker"
              class="w-full rounded-md border border-gray-300 p-2 dark:bg-gray-800 dark:border-gray-700"
              placeholder="Pilih Tanggal Libur..."
              readonly
            />
            <span class="cursor-pointer text-xl" id="calendarIcon">📅</span>
          </div>
        </div>
        <div class="flex items-center mb-3">
          <span class="text-sm mr-3 text-gray-700 dark:text-gray-300"
            >Tampilkan Sabtu & Minggu</span
          >
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" id="toggleWeekend" class="sr-only peer" />
            <div
              class="w-11 h-6 bg-gray-300 rounded-full peer peer-checked:bg-green-500 transition-all duration-300"
            ></div>
            <div
              class="absolute left-0.5 top-0.5 w-5 h-5 bg-white rounded-full shadow-md transform peer-checked:translate-x-5 transition-all duration-300"
            ></div>
          </label>
        </div>

        <div id="holidayTagsContainer" class="flex flex-wrap gap-2"></div>
      </form>
      <div id="result" class="mt-10">
        <h2 class="text-2xl font-semibold mb-4">Hasil Perhitungan</h2>
        <table
          class="w-full table-auto border border-gray-300 dark:border-gray-600"
        >
          <tbody id="resultTable" class="text-left"></tbody>
        </table>
      </div>

      <div class="mt-10">
        <div class="flex items-center mb-3">
          <span class="text-sm mr-3 text-gray-700 dark:text-gray-300">
            Tampilkan Kalkulasi Waktu
          </span>
          <label class="relative inline-flex items-center cursor-pointer">
            <input
              type="checkbox"
              id="toggleCalculation"
              class="sr-only peer"
            />
            <div
              class="w-11 h-6 bg-gray-300 rounded-full peer peer-checked:bg-green-500 transition-all duration-300"
            ></div>
            <div
              class="absolute left-0.5 top-0.5 w-5 h-5 bg-white rounded-full shadow-md transform peer-checked:translate-x-5 transition-all duration-300"
            ></div>
          </label>
        </div>
      </div>

      <div
        id="calculationExplanation"
        class="hidden mt-4 space-y-2 text-sm font-mono"
      ></div>
    </div>

    <button
      id="toggleThemeBtn"
      class="fixed bottom-4 right-4 w-12 h-12 rounded-full flex items-center justify-center shadow-lg dark:bg-gray-700 bg-yellow-500 text-white cursor-move"
    >
      <i class="bi bi-moon-stars-fill" id="themeIcon"></i>
    </button>

    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script type="module" src="script.js"></script>
  </body>
</html>
