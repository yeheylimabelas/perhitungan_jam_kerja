<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perhitungan Jam Kerja</title>

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
      };
    </script>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css"
    />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined"
    />
    <link
      rel="icon"
      href="Clock_icon-removebg-preview.png"
      type="image/x-icon"
    />
  </head>
  <body
    class="bg-white text-black dark:bg-gray-900 dark:text-white min-h-screen p-4"
  >
    <div class="max-w-3xl mx-auto">
      <h1 class="text-3xl font-bold mb-6">Perhitungan Jam Kerja</h1>

      <form id="dateForm" class="space-y-6">
        <div>
          <label for="startDate" class="block mb-1 font-medium"
            >Masukkan tanggal mulai:</label
          >
          <div class="flex items-center gap-2">
            <input
              type="text"
              id="startDate"
              class="w-full rounded-md border border-gray-300 p-2 dark:bg-gray-800 dark:border-gray-700"
              readonly
              required
            />
            <span class="cursor-pointer text-xl" id="startDateIcon">📅</span>
          </div>
        </div>

        <div>
          <label for="endDate" class="block mb-1 font-medium"
            >Masukkan tanggal akhir:</label
          >
          <div class="flex items-center gap-2">
            <input
              type="text"
              id="endDate"
              class="w-full rounded-md border border-gray-300 p-2 dark:bg-gray-800 dark:border-gray-700"
              readonly
              required
            />
            <span class="cursor-pointer text-xl" id="endDateIcon">📅</span>
          </div>
        </div>

        <div>
          <label for="holidayPicker" class="block mb-1 font-medium"
            >Pilih Hari Libur (bisa lebih dari 1):</label
          >
          <div class="flex items-center gap-2">
            <input
              type="text"
              id="holidayPicker"
              class="w-full rounded-md border border-gray-300 p-2 dark:bg-gray-800 dark:border-gray-700"
              placeholder="Pilih tanggal libur..."
              readonly
            />
            <span class="cursor-pointer text-xl" id="calendarIcon">📅</span>
          </div>
        </div>
        <div class="flex items-center mb-3">
          <span class="text-sm mr-3 text-gray-700 dark:text-gray-300"
            >Show Weekend</span
          >
          <label class="relative inline-flex items-center cursor-pointer">
            <input type="checkbox" id="toggleWeekend" class="sr-only peer" />
            <div
              class="w-11 h-6 bg-gray-300 rounded-full peer peer-checked:bg-green-500 transition-all duration-300"
            ></div>
            <div
              class="absolute left-0.5 top-0.5 w-5 h-5 bg-white rounded-full shadow-md transform peer-checked:translate-x-5 transition-all duration-300"
            ></div>
          </label>
        </div>

        <div id="holidayTagsContainer" class="flex flex-wrap gap-2"></div>
      </form>
      <div id="result" class="mt-10">
        <h2 class="text-2xl font-semibold mb-4">Hasil Perhitungan</h2>
        <table
          class="w-full table-auto border border-gray-300 dark:border-gray-600"
        >
          <tbody id="resultTable" class="text-left"></tbody>
        </table>
      </div>
    </div>

    <button
      id="toggleThemeBtn"
      class="fixed bottom-4 right-4 w-12 h-12 rounded-full flex items-center justify-center shadow-lg dark:bg-gray-700 bg-yellow-500 text-white cursor-move"
    >
      <i class="bi bi-moon-stars-fill" id="themeIcon"></i>
    </button>

    <script type="module" src="script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  </body>
</html>
